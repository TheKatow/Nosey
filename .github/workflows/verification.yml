name: Executer la verification Nosey

on:
  schedule:
    # Exécution automatique tous les jours à 08:00 UTC
    - cron: '0 8 * * *'
  # Permet de lancer le workflow manuellement depuis l'onglet Actions sur GitHub
  workflow_dispatch:

# Autorisation explicite d'écriture pour le bot GitHub Actions
permissions:
  contents: write

jobs:
  run-nosey-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v5

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Générer les candidates par catégorie
        run: python scripts/generateur_candidates.py

      - name: Exécuter le moteur de vérification et envoyer le récapitulatif Ntfy
        run: python scripts/moteur_verification.py

      - name: Enregistrer les modifications dans le dépôt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Vérification s'il y a des fichiers modifiés
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/fiches.json data/candidates.json
            git commit -m "auto: mise a jour du pipeline Nosey"
            git push
          else
            echo "Aucune modification détectée dans les fichiers JSON."
          fi
