name: Executer la verification Nosey

on:
  workflow_run:
    workflows: ["Routine quotidienne Nosey"]
    types: [completed]
  # Permet de lancer le workflow manuellement depuis l'onglet Actions sur GitHub
  workflow_dispatch:

# Autorisation explicite d'écriture pour le bot GitHub Actions
permissions:
  contents: write

jobs:
  run-nosey-pipeline:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v5

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Installer les dépendances Python
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Vérifier la présence de candidates
        id: presence_candidates
        run: |
          python - <<'PY'
          import json
          import os

          try:
              with open('data/candidates.json', 'r', encoding='utf-8') as f:
                  candidates = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              candidates = []

          presente = isinstance(candidates, list) and len(candidates) > 0
          print(f"📌 Candidates disponibles : {len(candidates) if isinstance(candidates, list) else 0}.")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"present={str(presente).lower()}\n")
          PY

      - name: Vérification des articles et sources fiables
        id: verification_fiches
        if: steps.presence_candidates.outputs.present == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          import uuid

          def charger_fiches():
              if not os.path.exists('data/fiches.json'):
                  return []
              try:
                  with open('data/fiches.json', 'r', encoding='utf-8') as f:
                      fiches = json.load(f)
                  return fiches if isinstance(fiches, list) else []
              except Exception:
                  return []

          fiches_avant = charger_fiches()
          ids_avant = {fiche.get('id') for fiche in fiches_avant if fiche.get('id')}
          print(f"📌 Avant vérification : {len(fiches_avant)} fiche(s) valide(s) détectée(s).")

          import subprocess
          result = subprocess.run(["python", "scripts/moteur_verification.py"], check=False)

          fiches_apres = charger_fiches()
          fiches_creees = [
              fiche for fiche in fiches_apres
              if fiche.get('id') and fiche.get('id') not in ids_avant
          ]
          nouvelles_fiches = len(fiches_creees)

          print(f"📌 Après vérification : {len(fiches_apres)} fiche(s) valide(s).")
          print(f"📌 Résumé : {nouvelles_fiches} fiche(s) ajoutée(s) / retrouvée(s) dans cette vérification.")

          details_fiches = []
          for fiche in fiches_creees:
              sujet = fiche.get('sujet') or 'Sujet non renseigné'
              domaine = fiche.get('domaine') or 'Domaine non renseigné'
              theme = fiche.get('theme') or 'Thème non renseigné'
              fait = fiche.get('fait_texte') or 'Fait non renseigné'
              localisation = fiche.get('localisation') or 'Lieu non renseigné'
              source_nom = fiche.get('source_nom') or 'Source non renseignée'
              source_url = fiche.get('source_url') or ''
              source = f"{source_nom} ({source_url})" if source_url else source_nom
              details_fiches.append(
                  f"Sujet : {sujet}\nDomaine / thème : {domaine} / {theme}\n"
                  f"Fait : {fait}\nLieu : {localisation}\nSource : {source}"
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"count={nouvelles_fiches}\n")
              delimiter = f"FICHES_{uuid.uuid4().hex}"
              output.write(f"details<<{delimiter}\n")
              output.write("\n\n---\n\n".join(details_fiches) + "\n")
              output.write(f"{delimiter}\n")

          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write("### Résumé de la vérification Nosey\n")
                  if nouvelles_fiches > 0:
                      summary.write(f"- ✅ {nouvelles_fiches} fiche(s) validée(s) et ajoutée(s) à la base.\n")
                  else:
                      summary.write("- ℹ️ Aucune nouvelle fiche validée. Les candidats existants ne remplissent pas les critères de qualité.\n")
                  summary.write(f"- Total final : {len(fiches_apres)} fiche(s) valide(s).\n\n")

          if result.returncode != 0:
              print(f"⚠️ Le moteur de vérification a échoué avec le code {result.returncode}.")
              raise SystemExit(result.returncode)
          PY

      - name: Notifier les nouvelles fiches sur ntfy
        if: steps.presence_candidates.outputs.present == 'true' && steps.verification_fiches.outputs.count != '0'
        env:
          MESSAGE: ${{ steps.verification_fiches.outputs.details }}
          FICHES_COUNT: ${{ steps.verification_fiches.outputs.count }}
        run: |
          curl --fail --silent --show-error \
            -H "Title: Nosey : ${FICHES_COUNT} nouvelle(s) fiche(s)" \
            -H "Priority: default" \
            -H "Tags: nosey,bookmark" \
            -d "$MESSAGE" \
            https://ntfy.sh/Nosey

      - name: Enregistrer les modifications dans le dépôt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/fiches.json data/candidates.json
            git commit -m "auto: mise a jour du pipeline Nosey"
            git push
          else
            echo "Aucune modification détectée dans les fichiers JSON."
          fi
