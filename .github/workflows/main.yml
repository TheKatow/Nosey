name: Routine quotidienne Nosey

on:
  schedule:
    # Exécution automatique chaque nuit à 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  mise-a-jour-curiosites:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v5

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Installer les dépendances Python
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Recherche d'articles extraordinaires
        id: processus_recuperation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - << 'EOF'
          import subprocess
          import time
          import json
          import os

          MAX_TENTATIVES = 3
          ATTENTE_SECONDES = 3600 # 1 heure
          SUCCES = False

          def compter_candidates():
              if os.path.exists('data/candidates.json'):
                  try:
                      with open('data/candidates.json', 'r', encoding='utf-8') as f:
                          candidates = json.load(f)
                          return len(candidates) if isinstance(candidates, list) else 0
                  except Exception:
                      return 0
              return 0

          candidates_avant = compter_candidates()
          print(f"📌 Avant recherche extraordinaire : {candidates_avant} candidate(s) déjà présente(s).")

          for essai in range(1, MAX_TENTATIVES + 1):
              print(f"🔄 Tentative {essai}/{MAX_TENTATIVES} pour trouver un article extraordinaire...")
              resultat = subprocess.run(["python", "scripts/generateur_candidates.py"], check=False)

              if resultat.returncode == 75:
                print("⏸️ API limitée (429) : aucun autre appel ne sera lancé pendant cette tentative.")
                if essai < MAX_TENTATIVES:
                  print("⏳ Nouvelle tentative dans 1 heure...")
                  time.sleep(ATTENTE_SECONDES)
                continue

              candidates_actuelles = compter_candidates()
              nouvelles_candidates = max(candidates_actuelles - candidates_avant, 0)

              if candidates_actuelles >= 1:
                  print(f"✅ Recherche extraordinaire réussie : {candidates_actuelles} candidate(s) trouvée(s).")
                  print(f"📌 Résumé : {nouvelles_candidates} nouvelle(s) candidate(s) ajoutée(s) / retrouvée(s) dans cette exécution.")
                  if os.environ.get('GITHUB_STEP_SUMMARY'):
                      with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                          summary.write("### Résumé de la routine Nosey\n")
                          if nouvelles_candidates > 0:
                              summary.write(f"- ✅ {nouvelles_candidates} article(s) extraordinaire(s) ajouté(s) à la liste des candidates.\n")
                          else:
                              summary.write("- ℹ️ Des sujets extraordinaires existent déjà ; la routine n’ajoute pas de nouvelle candidate.\n")
                          summary.write(f"- Total candidat(s) actuel(s) : {candidates_actuelles}.\n\n")
                  SUCCES = True
                  break
              else:
                  print(f"⚠️ Aucune candidate extraordinaire trouvée ({candidates_actuelles}).")
                  if essai < MAX_TENTATIVES:
                      print("⏳ Attente de 1 heure avant la prochaine tentative...")
                      time.sleep(ATTENTE_SECONDES)

          if not SUCCES:
              total_final = compter_candidates()
              print(f"❌ Échec critique après 3 tentatives. Total final : {total_final} candidate(s) extraordinaire(s).")
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                      summary.write("### Résumé de la routine Nosey\n")
                      summary.write("- ❌ Aucun article extraordinaire n'a été trouvé après 3 tentatives.\n")
                      summary.write(f"- Total final : {total_final} candidate(s).\n")
              exit(1)
          EOF

      - name: Réinitialiser la blacklist après traitement
        if: success()
        run: printf '[]\n' > data/blacklist.json

      - name: Commit et Push des modifications si succès
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/candidates.json data/fiches.json data/blacklist.json
          
          if git diff --staged --quiet; then
            echo "Aucune modification à commiter."
          else
            git commit -m "🤖 [Automatique] Mise à jour quotidienne des fiches Nosey"
            git push
          fi

      - name: Notification ntfy en cas d'échec
        if: failure()
        run: |
          curl \
            -H "Title: 🚨 Alerte Nosey : Échec de la collecte" \
            -H "Priority: high" \
            -H "Tags: warning,nosey" \
            -d "Le workflow a échoué après 3 tentatives sur 3 heures. Moins de 2 fiches valides sont disponibles dans la base." \
            https://ntfy.sh/Nosey